name: Main Branch Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-scan-${{ github.ref }}
  # Every merged commit gets a complete post-merge result.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  scan:
    name: Scan main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build scanner
        run: cargo build --release -p soroban-scan-cli

      - name: Scan main against the committed baseline
        run: |
          ./target/release/soroban-scan scan . \
            --exclude 'fixtures/**' \
            --exclude 'examples/**' \
            --baseline .soroban-scan-baseline.json \
            --format sarif \
            --output main.sarif \
            --fail-on high

      - name: Upload SARIF to code scanning
        if: hashFiles('main.sarif') != ''
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          sarif_file: main.sarif
          category: soroban-scan-main
