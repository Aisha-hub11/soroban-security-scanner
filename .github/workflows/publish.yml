name: Publish crates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: crates-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Require a version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Publishing requires a v* tag; workflow_dispatch must run against a tag."
            exit 1
          fi

      - name: Verify tag matches the workspace version
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as handle:
              version = tomllib.load(handle)["workspace"]["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag
          if expected != version:
              raise SystemExit(
                  f"tag {tag!r} does not match workspace version {version!r}"
              )
          print(f"publishing {version}")
          PY

      - name: Verify changelog has a section for this tag
        run: |
          python3 tools/release_notes.py --tag "$GITHUB_REF_NAME" --output release-notes.md

      - name: Verify core package (cargo publish --dry-run)
        run: cargo publish --dry-run -p soroban-scan-core --locked

      # The CLI depends on the same-version core crate. Its dry-run can only
      # resolve against crates.io after core is published, so the publish job
      # below runs the CLI dry-run once the index has caught up.

  publish:
    name: Publish core then CLI
    needs: verify
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Publish soroban-scan-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p soroban-scan-core --locked

      - name: Wait for the core crate to be available
        run: |
          for attempt in $(seq 1 10); do
            if cargo publish --dry-run -p soroban-scan-cli --locked; then
              echo "soroban-scan-core is available"
              exit 0
            fi
            echo "core not indexed yet (attempt ${attempt}/10); retrying in 30s"
            sleep 30
          done
          echo "::error::soroban-scan-core did not become available in time"
          exit 1

      - name: Publish soroban-scan-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p soroban-scan-cli --locked

  release:
    name: Publish GitHub release notes and artifacts
    needs: [verify, publish]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract the changelog section for this tag
        run: |
          python3 tools/release_notes.py --tag "$GITHUB_REF_NAME" --output release-notes.md
          cat release-notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx \
            --format json \
            --manifest-path crates/soroban-scan-cli/Cargo.toml \
            --override-filename sbom
          test -f crates/soroban-scan-cli/sbom.json
          cp crates/soroban-scan-cli/sbom.json soroban-scan.cdx.json

      - name: Build the release binary
        run: |
          cargo build --release -p soroban-scan-cli
          tar -czf soroban-scan-x86_64-unknown-linux-gnu.tar.gz \
            -C target/release soroban-scan

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: soroban-scan-x86_64-unknown-linux-gnu.tar.gz

      - name: Upload SBOM and binary to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            soroban-scan.cdx.json \
            soroban-scan-x86_64-unknown-linux-gnu.tar.gz \
            --clobber
