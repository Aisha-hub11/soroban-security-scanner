name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  # Let every push to main finish so each merged commit has a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  reusable-workflow:
    name: Reusable workflow smoke scan
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-scan.yml
    with:
      path: examples/clean-contract
      format: terminal
      output: ""
      fail-on: high
      # Exercise the workflow from this commit rather than the published main.
      scanner-repository: ${{ github.repository }}
      scanner-ref: ${{ github.sha }}

  scan:
    name: Scan examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build scanner
        run: cargo build --release -p soroban-scan-cli

      - name: Gate on the clean examples
        run: |
          for example in clean-contract token escrow vault stellar-classic; do
            echo "::group::scan examples/${example}"
            ./target/release/soroban-scan scan "examples/${example}" \
              --fail-on high \
              --format terminal
            echo "::endgroup::"
          done

      - name: Produce SARIF for the vulnerable example
        run: |
          ./target/release/soroban-scan scan examples/vulnerable-contract \
            --format sarif \
            --output results.sarif \
            --fail-on none

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: soroban-scan
